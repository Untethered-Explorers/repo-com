[package]
# The package name is the stable nextest binary ID selected by PRIV-LIFE-1.
name = "lifecycle_contract"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded read-only lifecycle projections and SQLite verification for repo-com"

[lib]
name = "repo_com_lifecycle"
path = "src/lib.rs"

[dependencies]
repo-com-audit = { package = "audit_contract", path = "../repo-com-audit" }
repo-com-audit-query = { package = "audit_query_contract", path = "../repo-com-audit-query" }
repo-com-state = { package = "state_contract", path = "../repo-com-state" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
