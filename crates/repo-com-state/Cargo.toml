[package]
# The package name is the stable nextest binary ID selected by REPO-STATE-1.
name = "state_contract"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Repository-scoped transactional SQLite state for repo-com"

[lib]
name = "repo_com_state"
