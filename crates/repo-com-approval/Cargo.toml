[package]
# The package name preserves the focused approval contract boundary; the
# integration-test target below provides the stable approval_contract binary.
name = "approval_contract"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Exact-revision TTY approval and redacted safety override for repo-com"

[lib]
name = "repo_com_approval"
path = "src/lib.rs"

[dependencies]
repo-com-audit = { package = "audit_contract", path = "../repo-com-audit" }
repo-com-config = { package = "config_contract", path = "../repo-com-config" }
repo-com-draft-model = { package = "draft_model_contract", path = "../repo-com-draft-model" }
repo-com-draft-safety = { package = "draft_safety_contract", path = "../repo-com-draft-safety" }
repo-com-foundation = { package = "foundation_contract", path = "../repo-com-foundation" }
repo-com-policy = { package = "policy_contract", path = "../repo-com-policy" }
repo-com-state = { package = "state_contract", path = "../repo-com-state" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.0"
