[package]
# The package name is the stable nextest binary ID selected by REL-DOC-1.
name = "documentation_contract"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Topic, alignment, and secret-pattern validation for repo-com documentation"

[lib]
name = "repo_com_doc_validation"
path = "src/lib.rs"

[dev-dependencies]
repo-com-cli-messaging = { package = "cli_messaging_contract", path = "../repo-com-cli-messaging" }
repo-com-config = { package = "config_contract", path = "../repo-com-config" }
repo-com-cli-operations = { package = "cli_operations_contract", path = "../repo-com-cli-operations" }
repo-com-delivery = { package = "delivery_contract", path = "../repo-com-delivery" }
repo-com-foundation = { package = "foundation_contract", path = "../repo-com-foundation" }
repo-com-retention = { package = "retention_contract", path = "../repo-com-retention" }
serde_json.workspace = true
