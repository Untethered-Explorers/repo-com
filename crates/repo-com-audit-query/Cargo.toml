[dependencies]
repo-com-audit = { package = "audit_contract", path = "../repo-com-audit" }
repo-com-state = { package = "state_contract", path = "../repo-com-state" }
rusqlite.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
