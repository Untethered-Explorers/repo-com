[package]
# The package name is the stable nextest binary ID selected by REPO-AUDIT-2.
name = "audit_query_contract"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded repository-scoped local audit evidence queries for repo-com"

[lib]
name = "repo_com_audit_query"
