[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
dirs = "=7.0.0"
# Do not enable rusqlite's bundled source here: the workspace release gate
# supplies a patched SQLite >= 3.53.4 and the runtime boundary rejects older engines.
rusqlite = { version = "=0.40.2", default-features = false, features = ["modern_sqlite"] }
rusqlite_migration = { version = "=2.6.0", default-features = false }
